name: "dotdotpwn"
command: "dotdotpwn"
# 路径遍历（LFI/目录穿越）fuzzer：HTTP/FTP/TFTP/SMB/TFTP/CMD/PAYLOAD 多协议
# 默认 -m http
args: ["-m", "http"]
enabled: true
short_description: "路径遍历 LFI 检测：HTTP/FTP/TFTP/SMB 多协议，自动生成 ../ 变体绕过"
description: |
  dotdotpwn 路径遍历（LFI/目录穿越）fuzzer。

  **模式：**
  - `http`：HTTP 路径穿越（最常用）
  - `ftp`/`tftp`/`smb`：对应协议
  - `payload`：自定义 payload 文件

  **工作流程：**
  1. 对目标 URL 的指定参数注入各种 `../` 编码变体（URL编码/双写/`..%2f`/`%2e%2e/` 等）
  2. 检测响应是否包含目标文件内容（如 `/etc/passwd`）

  常用于 LFI/RFI 漏洞验证。

  请确保有授权。
parameters:
  - name: "target"
    type: "string"
    description: |
      目标。HTTP 模式传 URL（含参数），其他模式传 host:port。
      示例：`http://example.com/page?file=`
    required: true
    flag: "-d"
    format: "flag"
  - name: "mode"
    type: "string"
    description: "模式：`http` | `ftp` | `tftp` | `smb` | `payload`"
    required: false
    flag: "-m"
    format: "flag"
  - name: "keyword"
    type: "string"
    description: |
      命中标志关键字（响应中出现即算成功）。
      示例：`root:x:`（测 /etc/passwd）
    required: false
    flag: "-k"
    format: "flag"
  - name: "file"
    type: "string"
    description: "目标文件路径（如 `/etc/passwd`、`C:/windows/win.ini`）"
    required: false
    flag: "-f"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外参数。示例：`-x`（用渗透测试 payload 集）"
    required: false
    format: "positional"
