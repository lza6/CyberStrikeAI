name: "js-secret-scanner"
command: "python3"
args:
  - "-c"
  - |
    import sys, json, re, urllib.parse, urllib.request
    # 扫描 JS bundle 里的云凭据/敏感令牌
    # 用法：python3 -c '<script>' "<js_url_or_path>" "<additional_args>"
    src = sys.argv[1] if len(sys.argv) > 1 else ""
    if not src:
        print(json.dumps({"error": "js url or local path required"}, ensure_ascii=False)); sys.exit(1)
    def fetch(url):
        with urllib.request.urlopen(url, timeout=10) as r: return r.read().decode("utf-8","ignore")
    try:
        body = fetch(src) if src.startswith("http") else open(src, "r", encoding="utf-8", errors="ignore").read()
    except Exception as e:
        print(json.dumps({"error": str(e)[:200]}, ensure_ascii=False)); sys.exit(1)
    patterns = {
        "AWS Access Key ID": re.compile(r"AKIA[0-9A-Z]{16}"),
        "AWS Secret (40 base64)": re.compile(r"(?<![A-Za-z0-9/+=])[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])"),
        "GCP service account": re.compile(r'"type":\s*"service_account"'),
        "GCP API key": re.compile(r"AIza[0-9A-Za-z_\-]{35}"),
        "OpenAI sk-": re.compile(r"sk-[A-Za-z0-9]{20,}"),
        "Bearer JWT": re.compile(r"eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}"),
        "Generic secret= ": re.compile(r"(?i)(secret|token|api[_-]?key|passwd|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
        "slack token": re.compile(r"xox[baprs]-[0-9A-Za-z-]{10,}"),
        "stripe key": re.compile(r"(sk|pk)_(live|test)_[0-9A-Za-z]{20,}"),
        "github pat": re.compile(r"gh[pousr]_[A-Za-z0-9]{30,}"),
    }
    hits = []
    for name, rx in patterns.items():
        for m in rx.finditer(body):
            s = m.group(0)
            idx = m.start()
            ctx = body[max(0, idx-40):idx+len(s)+40].replace("\n"," ")
            hits.append({"type": name, "match": s[:8] + "…(redacted)", "context": ctx})
    # source map 探测
    smap = None
    m = re.search(r"//[#@]\s*sourceMappingURL\s*=\s*([^\s'\"]+)", body)
    if m: smap = m.group(1)
    print(json.dumps({"hits": hits[:50], "source_map": smap, "scanned_bytes": len(body)}, ensure_ascii=False, indent=2))
    sys.exit(0 if hits or smap else 1)
parameters:
  - name: "js_url_or_path"
    type: "string"
    description: |
      JS bundle 的 URL 或本地文件路径。URL 会自动抓取。
      示例：`https://victim.example.com/static/app.bundle.js`
    required: true
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "额外参数"
    required: false
    format: "positional"
enabled: true
short_description: "扫描 JS bundle 里的云凭据/敏感令牌（AWS/GCP/OpenAI/Stripe/Slack/GitHub 等）+ source map"
