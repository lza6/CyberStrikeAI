<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberStrikeAI 启动中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 600px; height: 400px;
      background: #0b0f14;
      color: #e6e8ec;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      -webkit-app-region: drag; user-select: none; overflow: hidden;
      border-radius: 12px;
    }
    .logo {
      width: 88px; height: 88px; border-radius: 18px;
      background: linear-gradient(135deg, #4a9eff 0%, #2d6cdf 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; font-weight: 700; color: #fff; margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(74, 158, 255, 0.35);
    }
    .title { font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
    .status {
      font-size: 13px; color: #8b95a7; margin-bottom: 28px; min-height: 18px;
    }
    .progress-track {
      width: 240px; height: 4px; background: #1e2530; border-radius: 2px; overflow: hidden;
    }
    .progress-bar {
      width: 40%; height: 100%;
      background: linear-gradient(90deg, #4a9eff, #6bb6ff);
      border-radius: 2px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { margin-left: -40%; }
      50% { margin-left: 100%; }
      100% { margin-left: 100%; }
    }
    .hint { margin-top: 16px; font-size: 11px; color: #5a6478; }
  </style>
</head>
<body>
  <div class="logo">CS</div>
  <div class="title">CyberStrikeAI</div>
  <div class="status" id="status">启动后端服务…</div>
  <div class="progress-track"><div class="progress-bar"></div></div>
  <div class="hint">智能渗透平台 · 本地授权测试</div>
  <script>
    const { ipcRenderer } = require('electron');
    function updateStatus(text) {
      const el = document.getElementById('status');
      if (el) el.textContent = text || '启动中…';
    }
    // 主进程通过 executeJavaScript 调用 updateStatus 更新阶段文案
  </script>
</body>
</html>
