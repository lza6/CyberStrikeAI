name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # mattn/go-sqlite3 需要 CGO；Ubuntu runner 自带 gcc
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # K10：go-version-file 防 CI 与 module 漂移（替代硬编 '1.25'）
          go-version-file: go.mod
      # K10：gofmt gate——未格式化文件非空则 exit 1
      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt 检查："
            echo "$unformatted"
            echo "::error::请运行 gofmt -w . 后重新提交"
            exit 1
          fi
          echo "gofmt 检查通过（0 文件未格式化）"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # K3：测试带 -race（移植自 agent-orchestrator ci.yml test job + golang/rules race 要求）。
      - name: Test (race)
        run: go test -race -count=1 ./...

  # K10：golangci-lint v2 门禁（对标 agent-orchestrator CI 矩阵）。
  # v2 schema + zero-findings blocking：与 quality.yml 的 v1 并存，CI 切 v2。
  golangci-v2:
    name: golangci-lint v2 (zero-findings)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint v2
        uses: golangci/golangci-lint-action@v6
        with:
          # v2 schema 安装：go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2
          version: v2.0.2
          args: --config .golangci.v2.yml
