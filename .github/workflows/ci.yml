name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # mattn/go-sqlite3 需要 CGO；Ubuntu runner 自带 gcc
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # K3：测试带 -race（移植自 agent-orchestrator ci.yml test job + golang/rules race 要求）。
      - name: Test (race)
        run: go test -race -count=1 ./...
