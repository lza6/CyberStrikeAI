name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # mattn/go-sqlite3 需要 CGO；Ubuntu runner 自带 gcc
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1
